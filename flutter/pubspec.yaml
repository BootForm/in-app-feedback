name: in_app_feedback
description: "A feedback screen for your Flutter app with no backend: device info, an offline queue, and an optional screenshot, sent to BootForm."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
